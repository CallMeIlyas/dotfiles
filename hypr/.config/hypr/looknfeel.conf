# Liquid glass effect for Waybar
blurls = waybar

# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 20

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15

    active_opacity = 0.95
    inactive_opacity = 0.6
}

# Override default opacity rules for all windows
windowrule = opacity 0.95 0.6, match:class .*
windowrule = opacity 1.0 0.6, match:class Alacritty

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Enable workspace switching animation (slide effect)
    animation = workspaces, 1, 5, easeOutQuint, slide
    
    # Disable all animations (uncomment this line if you want to turn off ALL animations)
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
